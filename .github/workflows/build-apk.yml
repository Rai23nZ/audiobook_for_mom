name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Необязательно: собственный ключ подписи из секретов репозитория вместо ключа из keystore/.
      - name: Ключ подписи из секретов
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Тесты и сборка
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Имя файла
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Vslukh-1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Vslukh-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Релиз на GitHub
        if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Вслух 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Скачайте файл Vslukh-1.0.${{ github.run_number }}.apk на телефон и откройте его.
            Android попросит разрешить установку из этого источника — разрешите.
            Новая версия ставится поверх старой, позиции книг сохраняются.
